<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>六块三角板四棱锥插板模型</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #090b0d;
      color: #f3f5f7;
    }

    * { box-sizing: border-box; }
    html, body, #app, #scene { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #090b0d; }
    #scene { position: absolute; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    .toolbar {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 2;
      width: min(390px, calc(100vw - 36px));
      padding: 15px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 8px;
      background: rgba(14,17,20,.92);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 46px rgba(0,0,0,.32);
    }

    .heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
    h1 { margin: 0; font-size: 18px; line-height: 1.35; letter-spacing: 0; }
    .subtitle { margin: 5px 0 0; color: #aeb7bf; font-size: 12px; line-height: 1.55; }

    button, input { font: inherit; }
    button {
      min-width: 38px;
      min-height: 38px;
      padding: 7px 10px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 6px;
      color: #f5f7f9;
      background: #20262b;
      cursor: pointer;
    }
    button:hover { border-color: rgba(255,255,255,.42); background: #2a3238; }
    button:focus-visible, input:focus-visible { outline: 2px solid #65d9ff; outline-offset: 2px; }

    .controls { display: grid; gap: 11px; margin-top: 15px; }
    .control-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
    .control-row label { color: #dbe1e6; font-size: 12px; font-weight: 700; }
    input[type="range"] { width: 100%; accent-color: #ffbd4a; }
    output { min-width: 44px; color: #ffcf79; font-size: 12px; text-align: right; }

    .actions { display: flex; align-items: center; gap: 8px; }
    .segmented { display: grid; grid-template-columns: 1fr 1fr; flex: 1; }
    .segmented button { border-radius: 0; }
    .segmented button:first-child { border-radius: 6px 0 0 6px; }
    .segmented button:last-child { border-radius: 0 6px 6px 0; border-left: 0; }
    .segmented button.active { color: #061015; border-color: #65d9ff; background: #65d9ff; }
    .icon-button { width: 38px; padding: 0; font-size: 18px; }

    .legend {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 2;
      display: grid;
      gap: 7px;
      width: min(270px, calc(100vw - 36px));
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 8px;
      background: rgba(14,17,20,.88);
      color: #c5cdd4;
      font-size: 12px;
      line-height: 1.45;
      pointer-events: none;
    }
    .legend-row { display: flex; align-items: center; gap: 9px; }
    .swatch { width: 18px; height: 4px; flex: 0 0 auto; border-radius: 2px; }
    .shell-swatch { background: #6ec5e8; }
    .base-swatch { background: #e45b55; }
    .insert-swatch { background: #ffbd4a; }
    #status { color: #fff; font-weight: 700; }

    @media (max-width: 640px) {
      .toolbar { top: 10px; left: 10px; width: calc(100vw - 20px); padding: 12px; }
      .legend { right: 10px; bottom: 10px; width: calc(100vw - 20px); }
      h1 { font-size: 16px; }
      .subtitle { max-width: 290px; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <main id="app">
    <div id="scene" aria-label="五块三角板组成四棱锥，第六块沿对角剖面插入的三维模型"></div>

    <section class="toolbar" aria-label="模型控制">
      <div class="heading">
        <div>
          <h1>四棱锥插板模型</h1>
          <p class="subtitle">1-4 号板围成四个侧面，5 号板覆盖半个底面，6 号板与侧板等大并从右侧插入。</p>
        </div>
        <button id="resetView" class="icon-button" type="button" title="复位视角" aria-label="复位视角">↺</button>
      </div>

      <div class="controls">
        <div class="control-row">
          <label for="insertion">插入进度</label>
          <input id="insertion" type="range" min="0" max="100" value="100" step="1">
          <output id="insertionValue" for="insertion">100%</output>
        </div>
        <div class="actions">
          <button id="playInsertion" class="icon-button" type="button" title="播放插入动画" aria-label="播放插入动画">▶</button>
          <div class="segmented" role="group" aria-label="外壳显示方式">
            <button id="solidMode" type="button" aria-pressed="false">实体</button>
            <button id="xrayMode" class="active" type="button" aria-pressed="true">透视</button>
          </div>
        </div>
      </div>
    </section>

    <aside class="legend" aria-live="polite">
      <div class="legend-row"><span class="swatch shell-swatch"></span><span>1-4：四棱锥侧面</span></div>
      <div class="legend-row"><span class="swatch base-swatch"></span><span>5：半底面定位板</span></div>
      <div class="legend-row"><span class="swatch insert-swatch"></span><span>6：同尺寸板从右侧插入</span></div>
      <div id="status">第六块已插入到位</div>
    </aside>
  </main>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const sceneHost = document.getElementById('scene');
    const insertionInput = document.getElementById('insertion');
    const insertionValue = document.getElementById('insertionValue');
    const status = document.getElementById('status');
    const playButton = document.getElementById('playInsertion');
    const resetButton = document.getElementById('resetView');
    const solidModeButton = document.getElementById('solidMode');
    const xrayModeButton = document.getElementById('xrayMode');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x090b0d);
    scene.fog = new THREE.Fog(0x090b0d, 13, 24);

    const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    sceneHost.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.minDistance = 7;
    controls.maxDistance = 19;
    controls.target.set(0, 0.15, 0);

    scene.add(new THREE.HemisphereLight(0xd9f3ff, 0x241915, 2.1));
    const keyLight = new THREE.DirectionalLight(0xffffff, 3.3);
    keyLight.position.set(5, 8, 7);
    scene.add(keyLight);
    const rimLight = new THREE.DirectionalLight(0xff9b62, 2.2);
    rimLight.position.set(-6, 2, -5);
    scene.add(rimLight);

    const model = new THREE.Group();
    model.rotation.y = -0.1;
    scene.add(model);

    const apex = new THREE.Vector3(0, 3.25, 0);
    const base = [
      new THREE.Vector3(-2.45, -1.15, -2.45),
      new THREE.Vector3(2.45, -1.15, -2.45),
      new THREE.Vector3(2.45, -1.15, 2.45),
      new THREE.Vector3(-2.45, -1.15, 2.45)
    ];
    const thickness = 0.075;
    const shellPanels = [];

    function trianglePlateGeometry(points, depth) {
      const edgeA = new THREE.Vector3().subVectors(points[1], points[0]);
      const edgeB = new THREE.Vector3().subVectors(points[2], points[0]);
      const offset = new THREE.Vector3().crossVectors(edgeA, edgeB).normalize().multiplyScalar(depth / 2);
      const vertices = [];
      for (const sign of [1, -1]) {
        points.forEach(point => {
          const vertex = point.clone().addScaledVector(offset, sign);
          vertices.push(vertex.x, vertex.y, vertex.z);
        });
      }
      const indices = [
        0, 1, 2, 5, 4, 3,
        0, 3, 4, 0, 4, 1,
        1, 4, 5, 1, 5, 2,
        2, 5, 3, 2, 3, 0
      ];
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    function labelSprite(text, color) {
      const canvas = document.createElement('canvas');
      canvas.width = 192;
      canvas.height = 192;
      const context = canvas.getContext('2d');
      context.clearRect(0, 0, canvas.width, canvas.height);
      context.beginPath();
      context.arc(96, 96, 54, 0, Math.PI * 2);
      context.fillStyle = 'rgba(7, 10, 12, .88)';
      context.fill();
      context.lineWidth = 8;
      context.strokeStyle = color;
      context.stroke();
      context.fillStyle = '#ffffff';
      context.font = '700 72px "Segoe UI", sans-serif';
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      context.fillText(text, 96, 101);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false }));
      sprite.scale.set(0.72, 0.72, 0.72);
      sprite.renderOrder = 12;
      return sprite;
    }

    function addPlate(number, points, color, labelPosition, options = {}) {
      const group = new THREE.Group();
      const geometry = trianglePlateGeometry(points, thickness);
      const material = new THREE.MeshPhysicalMaterial({
        color,
        roughness: 0.43,
        metalness: 0.08,
        clearcoat: 0.45,
        clearcoatRoughness: 0.35,
        side: THREE.DoubleSide,
        transparent: true
      });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.renderOrder = options.renderOrder ?? 1;
      group.add(mesh);

      const edges = new THREE.LineSegments(
        new THREE.EdgesGeometry(geometry, 12),
        new THREE.LineBasicMaterial({ color: options.edgeColor ?? 0xeaf7ff, transparent: true, opacity: 0.78 })
      );
      edges.renderOrder = (options.renderOrder ?? 1) + 1;
      group.add(edges);

      const label = labelSprite(String(number), options.labelColor ?? '#65d9ff');
      label.position.copy(labelPosition);
      group.add(label);
      model.add(group);
      return { group, mesh, edges };
    }

    const sideColors = [0x347d9a, 0x568ba0, 0x3e7289, 0x4b91ad];
    for (let index = 0; index < 4; index += 1) {
      const next = (index + 1) % 4;
      const points = [apex, base[index], base[next]];
      const center = points.reduce((sum, point) => sum.add(point), new THREE.Vector3()).multiplyScalar(1 / 3);
      const outward = new THREE.Vector3().subVectors(center, new THREE.Vector3(0, 0.25, 0)).normalize();
      const panel = addPlate(index + 1, points, sideColors[index], center.addScaledVector(outward, 0.14));
      shellPanels.push(panel);
    }

    const basePanel = addPlate(
      5,
      [base[0], base[1], base[2]],
      0xc74c48,
      new THREE.Vector3(0.72, -1.32, -0.72),
      { labelColor: '#ff7770', edgeColor: 0xffd0cd, renderOrder: 3 }
    );
    shellPanels.push(basePanel);

    const referenceBaseLength = base[0].distanceTo(base[1]);
    const referenceSideLength = apex.distanceTo(base[0]);
    const referenceAltitude = Math.sqrt(
      referenceSideLength ** 2 - (referenceBaseLength / 2) ** 2
    );
    const verticalRise = apex.y - base[0].y;
    const horizontalRun = Math.sqrt(referenceAltitude ** 2 - verticalRise ** 2);
    const insertBaseDirection = new THREE.Vector3(1, 0, 1).normalize();
    const insertAltitudeHorizontal = new THREE.Vector3(-1, 0, 1).normalize();
    const insertAltitude = insertAltitudeHorizontal.multiplyScalar(horizontalRun)
      .add(new THREE.Vector3(0, verticalRise, 0));
    const insertBaseCenter = apex.clone().sub(insertAltitude);
    const insertHalfBase = insertBaseDirection.clone().multiplyScalar(referenceBaseLength / 2);
    const uncenteredInsertTarget = [
      apex,
      insertBaseCenter.clone().sub(insertHalfBase),
      insertBaseCenter.clone().add(insertHalfBase)
    ];
    const uncenteredInsertCenter = uncenteredInsertTarget
      .reduce((sum, point) => sum.add(point), new THREE.Vector3())
      .multiplyScalar(1 / 3);
    const insertCenteringOffset = new THREE.Vector3(
      -uncenteredInsertCenter.x,
      0,
      -uncenteredInsertCenter.z
    );
    const insertTarget = uncenteredInsertTarget.map(point => point.clone().add(insertCenteringOffset));
    const insertCenter = insertTarget.reduce((sum, point) => sum.add(point), new THREE.Vector3()).multiplyScalar(1 / 3);
    const insertPanel = addPlate(
      6,
      insertTarget,
      0xffa928,
      insertCenter.clone().add(new THREE.Vector3(0.08, 0.1, -0.08)),
      { labelColor: '#ffbd4a', edgeColor: 0xfff0c2, renderOrder: 8 }
    );
    const insertionOffset = insertBaseDirection.clone().multiplyScalar(6.2);

    const pathStart = insertCenter.clone().add(insertionOffset);
    const pathGeometry = new THREE.BufferGeometry().setFromPoints([pathStart, insertCenter]);
    const insertionPath = new THREE.Line(pathGeometry, new THREE.LineDashedMaterial({
      color: 0xffbd4a,
      dashSize: 0.22,
      gapSize: 0.13,
      transparent: true,
      opacity: 0.72
    }));
    insertionPath.computeLineDistances();
    insertionPath.renderOrder = 10;
    model.add(insertionPath);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(6.8, 80),
      new THREE.MeshStandardMaterial({ color: 0x111417, roughness: 0.96, metalness: 0.02 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -1.28;
    scene.add(ground);

    const grid = new THREE.GridHelper(12, 12, 0x31404a, 0x20282e);
    grid.position.y = -1.27;
    grid.material.transparent = true;
    grid.material.opacity = 0.42;
    scene.add(grid);

    let animationFrame = null;
    let animationStartedAt = 0;
    const animationDuration = 1800;

    function easeInOut(value) {
      return value < 0.5 ? 4 * value * value * value : 1 - ((-2 * value + 2) ** 3) / 2;
    }

    function setInsertionProgress(value) {
      const progress = THREE.MathUtils.clamp(Number(value) / 100, 0, 1);
      insertPanel.group.position.copy(insertionOffset).multiplyScalar(1 - progress);
      insertionInput.value = String(Math.round(progress * 100));
      insertionValue.value = `${Math.round(progress * 100)}%`;
      insertionPath.visible = progress < 0.995;
      if (progress >= 0.995) status.textContent = '第六块已插入到位';
      else if (progress <= 0.005) status.textContent = '第六块位于锥体外侧';
      else status.textContent = '第六块正在从右侧沿板面插入';
    }

    function stopAnimation() {
      if (animationFrame !== null) cancelAnimationFrame(animationFrame);
      animationFrame = null;
      playButton.textContent = '▶';
      playButton.title = '播放插入动画';
      playButton.setAttribute('aria-label', '播放插入动画');
    }

    function animateInsertion(now) {
      const elapsed = now - animationStartedAt;
      const progress = Math.min(1, elapsed / animationDuration);
      setInsertionProgress(easeInOut(progress) * 100);
      if (progress < 1) {
        animationFrame = requestAnimationFrame(animateInsertion);
      } else {
        stopAnimation();
      }
    }

    function playInsertion() {
      if (animationFrame !== null) {
        stopAnimation();
        return;
      }
      setInsertionProgress(0);
      animationStartedAt = performance.now();
      playButton.textContent = 'Ⅱ';
      playButton.title = '暂停插入动画';
      playButton.setAttribute('aria-label', '暂停插入动画');
      animationFrame = requestAnimationFrame(animateInsertion);
    }

    function setShellMode(xray) {
      shellPanels.forEach(panel => {
        panel.mesh.material.opacity = xray ? 0.24 : 0.9;
        panel.mesh.material.depthWrite = !xray;
        panel.edges.material.opacity = xray ? 0.28 : 0.78;
      });
      solidModeButton.classList.toggle('active', !xray);
      xrayModeButton.classList.toggle('active', xray);
      solidModeButton.setAttribute('aria-pressed', String(!xray));
      xrayModeButton.setAttribute('aria-pressed', String(xray));
    }

    function resetView() {
      camera.position.set(9.2, 5.8, 4.6);
      controls.target.set(0, 0.15, 0);
      controls.update();
    }

    insertionInput.addEventListener('input', () => {
      stopAnimation();
      setInsertionProgress(insertionInput.value);
    });
    playButton.addEventListener('click', playInsertion);
    resetButton.addEventListener('click', resetView);
    solidModeButton.addEventListener('click', () => setShellMode(false));
    xrayModeButton.addEventListener('click', () => setShellMode(true));

    function resize() {
      const width = sceneHost.clientWidth;
      const height = sceneHost.clientHeight;
      camera.aspect = width / Math.max(height, 1);
      camera.updateProjectionMatrix();
      renderer.setSize(width, height, false);
    }

    window.addEventListener('resize', resize);
    resetView();
    setInsertionProgress(100);
    setShellMode(true);
    resize();

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
